server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Tenants are resolved from the Host header upstream; don't leak the
    # server version while we're here.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-Frame-Options        "DENY"          always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # Process health for the ALB. Deliberately not the SPA index, so a broken
    # build fails the health check instead of serving a white screen.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    # Must never be cached: a stale service worker means clients never receive
    # updates.
    location = /sw.js {
        add_header Cache-Control         "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/"                                 always;
        add_header X-Content-Type-Options "nosniff"                           always;
        add_header X-Frame-Options        "DENY"                              always;
        add_header X-XSS-Protection       "1; mode=block"                     always;
    }

    location = /manifest.json {
        add_header Content-Type           "application/manifest+json"          always;
        add_header Cache-Control          "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                            always;
        add_header X-Frame-Options        "DENY"                               always;
        add_header X-XSS-Protection       "1; mode=block"                      always;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff"                             always;
        add_header X-Frame-Options        "DENY"                                always;
        add_header X-XSS-Protection       "1; mode=block"                       always;
    }

    # The entry point is never cached, otherwise a deploy ships new hashed
    # assets that nothing references.
    location = /index.html {
        add_header Cache-Control          "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                            always;
        add_header X-Frame-Options        "DENY"                               always;
        add_header X-XSS-Protection       "1; mode=block"                      always;
    }

    # SPA fallback: react-router owns client-side routes, so anything that
    # isn't a real file resolves to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
